server {
    listen 80;
    listen [::]:80;
    myportfolio.ommurugan.engineer;

    root /mnt/sda/om/Portfolio/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable Gzip Compression for fast load speeds
    gzip on;
    gzip_min_length 256;
    gzip_smart_accept_encoding on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/otf
        font/ttf
        font/woff
        font/woff2;

    # SPA Fallback: Route all requested paths to index.html for React Router / Client Navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (JS, CSS, Images, Fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|otf|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Optional: SSL / HTTPS Configuration (Uncomment when SSL certificate is generated)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/ommurugan.engineer/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ommurugan.engineer/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
}
